services:
  lx-sync-server:
    image: bobcc4/lxserver:V2
    container_name: lx-sync-server
    restart: always
    ports:
      - "9527:9527"
    volumes:
      # V2 is not an in-place upgrade. Back up and remove all legacy data and
      # media files before starting this image with an empty ./data directory.
      # Keep this directory on persistent NAS storage.
      # SQLite: ./data/media/media.db
      # Audio objects: ./data/media/objects
      - ./data:/server/data
    environment:
      - NODE_ENV=production
      # Example: - LX_USER_myuser=mypassword
