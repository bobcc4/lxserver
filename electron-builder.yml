appId: com.lxserver.desktop
productName: Yintuan
copyright: "Copyright © 2026 bobcc4"

# 覆盖 package.json 的 main 字段，让 Electron 使用 electron/main.js 而非 index.js
extraMetadata:
  main: electron/main.js
  description: Yintuan private music server and player

# [核心修复] 禁用打包时的原生模块自动重编，防止本地因缺少 C++ 编译环境而报错
npmRebuild: false

directories:
  output: dist-electron

# 打包进 asar 的文件（排除源码、Docker、开发工具等）
files:
  - server/**/*
  - public/**/*
  - index.js
  - config.js
  - package.json
  - LICENSE
  - NOTICE.md
  - electron/main.js
  - electron/icons/**/*
  - "!src"
  - "!scripts"
  - "!docs"
  - "!md"
  - "!logs"
  - "!data"
  - "!cache"
  - "!*.ts"
  - "!tsconfig.json"
  - "!ecosystem.config.js"
  - "!Dockerfile*"
  - "!docker-compose*"
  - "!.github"
  - "!electron-builder.yml"

# 原生 .node 文件必须解压到 asar 外部才能被 Node.js 加载
asarUnpack:
  - node_modules/music-tag-native/**/*
  - node_modules/bufferutil/**/*
  - node_modules/utf-8-validate/**/*
  - public/**/*

# 应用图标（提供 512x512 PNG，electron-builder 自动生成 ico / icns）
icon: electron/icons/icon.png

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  # 统一命名：文件名会根据架构自动变化，例如：Yintuan 1.1.1 x64.exe
  artifactName: "${productName} ${version} ${arch}.${ext}"
  target:
    - nsis
    - portable
  requestedExecutionLevel: asInvoker

nsis:
  artifactName: "${productName} ${version} ${arch} Setup.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Yintuan"

portable:
  artifactName: "${productName} ${version} ${arch} Portable.${ext}"

# ── macOS ────────────────────────────────────────────────────────────────────
mac:
  # 统一命名文件名
  artifactName: "${productName} ${version} ${arch}.${ext}"
  target:
    - dmg
  category: public.app-category.utilities

# ── Linux ────────────────────────────────────────────────────────────────────
linux:
  # 统一命名文件名
  artifactName: "${productName} ${version} ${arch}.${ext}"
  target:
    - AppImage
    - deb
  category: Utility
