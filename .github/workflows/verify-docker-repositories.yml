name: Verify Docker Hub repositories

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect repository visibility and tags
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          auth_payload=$(jq -nc \
            --arg username "$DOCKER_USERNAME" \
            --arg password "$DOCKER_PASSWORD" \
            '{username: $username, password: $password}')
          token=$(curl -fsS -H 'Content-Type: application/json' \
            -d "$auth_payload" https://hub.docker.com/v2/users/login/ | jq -r '.token')
          [[ -n "$token" && "$token" != "null" ]]

          create_repository() {
            local repository="$1"
            local private="$2"
            local response
            response=$(mktemp)
            local status
            status=$(curl -sS -X POST \
              -H "Authorization: JWT ${token}" \
              -H 'Content-Type: application/json' \
              -d "{\"namespace\":\"${DOCKER_USERNAME}\",\"name\":\"${repository}\",\"description\":\"Yinyun music server\",\"full_description\":\"\",\"is_private\":${private}}" \
              -o "$response" -w '%{http_code}' \
              'https://hub.docker.com/v2/repositories/')
            echo "Create ${repository}: HTTP ${status}"
            if [[ "$status" != "201" && "$status" != "200" ]]; then
              jq -c 'if type == "object" then with_entries(select(.key | test("token|password|secret"; "i") | not)) else . end' "$response" 2>/dev/null || cat "$response"
              rm -f "$response"
              return 1
            fi
            rm -f "$response"
          }

          for repository in yinyun-lxserver yinyun-lxserver-test; do
            body=$(mktemp)
            status=$(curl -sS -u "${DOCKER_USERNAME}:${DOCKER_PASSWORD}" \
              -o "$body" -w '%{http_code}' \
              "https://hub.docker.com/v2/repositories/${DOCKER_USERNAME}/${repository}/")
            echo "${repository}: HTTP ${status}"
            private=false
            [[ "$repository" == "yinyun-lxserver-test" ]] && private=true
            if [[ "$status" == "404" ]]; then
              echo "Creating Docker Hub repository metadata for ${repository}"
              create_repository "$repository" "$private"
              status=$(curl -sS -u "${DOCKER_USERNAME}:${DOCKER_PASSWORD}" \
                -o "$body" -w '%{http_code}' \
                "https://hub.docker.com/v2/repositories/${DOCKER_USERNAME}/${repository}/")
              echo "${repository} after create: HTTP ${status}"
            fi
            if [[ "$status" == "200" ]]; then
              jq '{name, is_private, status}' "$body"
              curl -fsS -X PATCH \
                -H "Authorization: JWT ${token}" \
                -H 'Content-Type: application/json' \
                -d "{\"is_private\":${private}}" \
                "https://hub.docker.com/v2/repositories/${DOCKER_USERNAME}/${repository}/" | jq '{name, is_private, status}'
              curl -fsS -u "${DOCKER_USERNAME}:${DOCKER_PASSWORD}" \
                "https://hub.docker.com/v2/repositories/${DOCKER_USERNAME}/${repository}/tags?page_size=100" \
                | jq -r '.results[]?.name' | sort | sed 's/^/tag: /'
            else
              cat "$body"
              exit 1
            fi
            rm -f "$body"
          done
