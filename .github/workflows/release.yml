name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version (for example, v1.3.0)
        required: false
        type: string
      publish:
        description: Create a GitHub Release after the build
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_server:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="v$(node -p "require('./package.json').version")"
          fi
          node scripts/prepare-release.js "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install, test and build
        run: |
          npm ci
          npm test
          node scripts/download-binary.js --all
          npm run build
          rm -rf node_modules
          npm ci --omit=dev

      - name: Create server archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release/yinyun
          cp -r server node_modules public scripts index.js package.json LICENSE NOTICE.md release/yinyun/
          [[ -f config.js ]] && cp config.js release/yinyun/
          cd release
          zip -r "../Yinyun-Server-${VERSION#v}-Linux-x64.zip" yinyun

      - name: Upload server package and release notes
        uses: actions/upload-artifact@v7
        with:
          name: yinyun-server
          path: |
            Yinyun-Server-*.zip
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: build_server
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: yinyun-server
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build_server.outputs.version }}
        run: |
          ASSET="release-assets/Yinyun-Server-${VERSION#v}-Linux-x64.zip"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$ASSET" --clobber
            gh release edit "$VERSION" --title "音云 服务端 $VERSION" --notes-file release-assets/RELEASE_NOTES.md --latest
          else
            gh release create "$VERSION" "$ASSET" --title "音云 服务端 $VERSION" --notes-file release-assets/RELEASE_NOTES.md --latest
          fi
