name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, v1.0.0)
        required: true
        default: v1.0.0
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$INPUT_VERSION"
          fi

          node scripts/prepare-release.js "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  build_desktop:
    needs: init
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            artifact: windows-x64
          - os: macos-latest
            platform: mac
            arch: x64
            artifact: macos-x64
          - os: macos-latest
            platform: mac
            arch: arm64
            artifact: macos-arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    name: Desktop ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2t64

      - name: Install dependencies
        run: npm ci

      - name: Read Electron version
        id: electron
        shell: bash
        run: node -p '"version=" + require("./node_modules/electron/package.json").version' >> "$GITHUB_OUTPUT"

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -v "${{ steps.electron.outputs.version }}" --arch "${{ matrix.arch }}"
        env:
          npm_config_build_from_source: true

      - name: Build server code
        run: npm run electron:build

      - name: Package desktop application
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload desktop package
        uses: actions/upload-artifact@v7
        with:
          name: lxserver-${{ matrix.artifact }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: error
          retention-days: 7

  build_server:
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          node scripts/download-binary.js --all
          npm run build
          rm -rf node_modules
          npm ci --omit=dev

      - name: Create server archive
        shell: bash
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          mkdir -p release/lx-music-sync-server
          cp -r server node_modules public scripts index.js package.json LICENSE NOTICE.md release/lx-music-sync-server/
          [[ -f config.js ]] && cp config.js release/lx-music-sync-server/
          cd release
          zip -r "lx-music-sync-server-${VERSION}-linux-x64.zip" lx-music-sync-server

      - name: Upload server package
        uses: actions/upload-artifact@v7
        with:
          name: lxserver-server
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [init, build_desktop, build_server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          gh release create "$VERSION" \
            release-assets/*.exe \
            release-assets/*.dmg \
            release-assets/*.AppImage \
            release-assets/*.deb \
            release-assets/*.zip \
            --target "$GITHUB_SHA" \
            --title "LX Music Sync Server V1 $VERSION" \
            --notes-file release-assets/RELEASE_NOTES.md \
            --latest
