name: Build and Push Docker Image

on:
  workflow_call:
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  # 使用 github.repository_owner 获取用户名，并指定音云镜像名
  IMAGE_NAME: ${{ github.repository_owner }}/yinyun-lxserver
  # Docker Hub 仓库名
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_USERNAME }}/yinyun-lxserver

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Add QEMU for multi-platform build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate build hash
        run: node scripts/update-build-hash.js

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKER_HUB_REPO }}
          tags: |
            type=raw,value=v1
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=Yinyun
            org.opencontainers.image.description=音云 Yinyun private music server and Web player
            org.opencontainers.image.licenses=Apache-2.0

      - name: Delete old Docker image versions
        run: |
          PACKAGE_NAME="yinyun-lxserver"
          OWNER="${{ github.repository_owner }}"
          
          for TAG in "v1"; do
            echo "Checking for existing tag: $TAG"
            
            # 优先尝试用户 API，再尝试组织 API
            # 使用 --jq 过滤出 ID，如果命令失败或没找到，则返回空
            VERSION_ID=$(gh api "/users/$OWNER/packages/container/$PACKAGE_NAME/versions" --jq ".[] | select(.metadata.container.tags // [] | contains([\"$TAG\"])) | .id" 2>/dev/null || \
                        gh api "/orgs/$OWNER/packages/container/$PACKAGE_NAME/versions" --jq ".[] | select(.metadata.container.tags // [] | contains([\"$TAG\"])) | .id" 2>/dev/null || echo "")
            
            # 确保 VERSION_ID 是数字（有效的 ID），而不是 JSON 错误信息
            if [[ "$VERSION_ID" =~ ^[0-9]+$ ]]; then
              echo "Deleting old version for $TAG (ID: $VERSION_ID)"
              gh api -X DELETE "/users/$OWNER/packages/container/$PACKAGE_NAME/versions/$VERSION_ID" 2>/dev/null || \
              gh api -X DELETE "/orgs/$OWNER/packages/container/$PACKAGE_NAME/versions/$VERSION_ID" 2>/dev/null || echo "Delete failed, skipping..."
            else
              echo "No valid existing version ID found for tag: $TAG, skipping cleanup."
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Enable multi-platform build
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
