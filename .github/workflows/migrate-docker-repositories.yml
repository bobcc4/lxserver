name: Stage Docker Hub repository migration

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage all images in private GHCR storage
        env:
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          staging="ghcr.io/${OWNER}/yinyun-lxserver-migration"

          stage_image() {
            local source="$1"
            local target_tag="$2"
            echo "Staging ${source} as ${staging}:${target_tag}"
            docker buildx imagetools create \
              --tag "${staging}:${target_tag}" \
              "${source}"
            docker buildx imagetools inspect "${staging}:${target_tag}"
          }

          stage_image "docker.io/${OWNER}/yinyun-lxserver:v1" formal-v1
          stage_image "docker.io/${OWNER}/lxserver-test:v1" test-v1
          stage_image "docker.io/${OWNER}/lxserver-test:v2" test-v2
