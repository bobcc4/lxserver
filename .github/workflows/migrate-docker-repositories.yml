name: Restore Docker Hub repository migration

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore all images from private GHCR storage
        env:
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          staging="ghcr.io/${OWNER}/yinyun-lxserver-migration"

          restore_image() {
            local source_tag="$1"
            local target="$2"
            echo "Restoring ${staging}:${source_tag} as ${target}"
            docker buildx imagetools create \
              --tag "${target}" \
              "${staging}:${source_tag}"
            docker buildx imagetools inspect "${target}"
          }

          restore_image formal-v1 "docker.io/${OWNER}/yinyun-lxserver:v1"
          restore_image test-v1 "docker.io/${OWNER}/yinyun-lxserver-test:v1"
          restore_image test-v2 "docker.io/${OWNER}/yinyun-lxserver-test:v2"

      - name: Remove private GHCR migration package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          package="yinyun-lxserver-migration"
          mapfile -t versions < <(
            gh api --paginate \
              "/users/${OWNER}/packages/container/${package}/versions" \
              --jq '.[].id'
          )
          for version in "${versions[@]}"; do
            [[ -z "$version" ]] && continue
            echo "Deleting GHCR migration version ${version}"
            gh api --method DELETE \
              "/users/${OWNER}/packages/container/${package}/versions/${version}"
          done
